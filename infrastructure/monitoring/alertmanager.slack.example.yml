global:
  resolve_timeout: 5m
  slack_api_url_file: /run/secrets/slack_webhook_url

route:
  receiver: slack-operations
  group_by: ["service", "alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: slack-operations
      matchers: ['severity="critical"']
      repeat_interval: 1h

receivers:
  - name: slack-operations
    slack_configs:
      - channel: "#stockpilot-alerts"
        send_resolved: true
        title: '{{ .Status | toUpper }} · {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_matchers: ['alertname="StockPilotApiUnavailable"']
    target_matchers: ['severity="warning"']
    equal: ["service"]
