global:
  resolve_timeout: 5m

route:
  receiver: stockpilot-local
  group_by: ["service", "alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: stockpilot-local
      matchers: ['severity="critical"']
      repeat_interval: 1h

receivers:
  - name: stockpilot-local

inhibit_rules:
  - source_matchers: ['alertname="StockPilotApiUnavailable"']
    target_matchers: ['severity="warning"']
    equal: ["service"]
