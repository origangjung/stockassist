events {}

http {
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    limit_req_zone $binary_remote_addr zone=admin_bff:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=market_bff:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=websocket_per_ip:10m;
    upstream stockpilot_api {
        zone stockpilot_api 64k;
        server api:8000 resolve;
    }

    upstream stockpilot_web {
        zone stockpilot_web 64k;
        server web:3000 resolve;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        location /api/admin/ {
            limit_req zone=admin_bff burst=10 nodelay;
            proxy_pass http://stockpilot_web;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/market/ {
            limit_req zone=market_bff burst=40 nodelay;
            proxy_pass http://stockpilot_web;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/analysis/ {
            limit_req zone=market_bff burst=20 nodelay;
            proxy_pass http://stockpilot_web;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 모의투자는 허용 경로와 요청 크기를 검증하는 Next.js BFF를 반드시 통과한다.
        location /api/paper/ {
            limit_req zone=market_bff burst=20 nodelay;
            proxy_pass http://stockpilot_web;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://stockpilot_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /ws/ {
            limit_conn websocket_per_ip 20;
            proxy_pass http://stockpilot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
        }

        location = /health {
            proxy_pass http://stockpilot_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /health/ {
            proxy_pass http://stockpilot_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            proxy_pass http://stockpilot_web;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
