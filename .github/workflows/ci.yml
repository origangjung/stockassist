name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject tracked secrets and generated artifacts
        run: python3 scripts/check_repository_hygiene.py
      - name: Validate environment-variable contract
        run: python3 scripts/check_env_contract.py
      - name: Validate documentation links and migration head
        run: python3 scripts/check_docs.py
      - name: Reject whitespace errors
        run: git show --check --format= HEAD

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.28
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra ml
      - name: Compile backend
        run: uv run python -m compileall -q backend
      - name: Lint backend
        run: uv run ruff check backend scripts
      - name: Test backend
        run: uv run pytest -q

  migrations:
    name: PostgreSQL migration round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockpilot_ci
          POSTGRES_USER: stockpilot_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockpilot_ci -d stockpilot_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://stockpilot_ci:ci-only-password@127.0.0.1:5432/stockpilot_ci
      PERSISTENCE_ENABLED: "true"
      STOCK_PROVIDER: mock
      FINANCIAL_PROVIDER: mock
      DISCLOSURE_PROVIDER: mock
      NEWS_PROVIDER: mock
      INVESTOR_FLOW_PROVIDER: mock
      AI_REPORT_PROVIDER: mock
      REALTIME_ENABLED: "false"
      CORPORATE_ACTION_APPROVAL_ENABLED: "false"
      MODEL_ARTIFACT_ACTIVATION_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.28
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Upgrade empty PostgreSQL database to head
        run: uv run alembic -c alembic.ini upgrade head
      - name: Verify current revision
        run: uv run alembic -c alembic.ini current --check-heads
      - name: Downgrade PostgreSQL database to base
        run: uv run alembic -c alembic.ini downgrade base
      - name: Re-upgrade PostgreSQL database to head
        run: uv run alembic -c alembic.ini upgrade head
      - name: Verify final revision
        run: uv run alembic -c alembic.ini current --check-heads

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.13.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Type-check web
        run: pnpm --filter @stockpilot/web exec tsc --noEmit --incremental false
      - name: Test web utilities
        run: pnpm --filter @stockpilot/web test
      - name: Build web
        run: pnpm --filter @stockpilot/web build
