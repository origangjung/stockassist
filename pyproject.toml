[project]
name = "stockpilot-ai"
version = "0.1.0"
description = "Investment decision-support platform — initial Stock Data Layer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "apscheduler>=3.10,<4.0",
  "httpx2>=2.0,<3.0",
  "redis>=5.0,<7.0",
  "websockets>=15.0,<17.0",
  "prometheus-client>=0.22,<1.0",
  "structlog>=25.5,<27.0",
  "sentry-sdk[fastapi]>=2.60,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10.0", "ruff>=0.8,<1.0"]
ml = ["scikit-learn>=1.5,<2.0", "xgboost>=2.1,<4.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
markers = [
  "ml: requires the optional scikit-learn and XGBoost dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py312"
