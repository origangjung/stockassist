x-security-defaults: &security-defaults
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *security-defaults
    init: true
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://stockpilot:change-me@postgres:5432/stockpilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PERSISTENCE_ENABLED: ${PERSISTENCE_ENABLED:-true}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      SCHEDULER_INTERVAL_MINUTES: ${SCHEDULER_INTERVAL_MINUTES:-5}
      SCHEDULER_SYMBOLS: ${SCHEDULER_SYMBOLS:-005930,000660,035420,AAPL,MSFT}
      SCHEDULER_INGESTION_LIMIT: ${SCHEDULER_INGESTION_LIMIT:-120}
      PARTITION_MAINTENANCE_ENABLED: ${PARTITION_MAINTENANCE_ENABLED:-true}
      PARTITION_LOOKAHEAD_MONTHS: ${PARTITION_LOOKAHEAD_MONTHS:-3}
      PARTITION_ARCHIVE_AFTER_MONTHS: ${PARTITION_ARCHIVE_AFTER_MONTHS:-120}
      PROVIDER_AUDIT_CLEANUP_ENABLED: ${PROVIDER_AUDIT_CLEANUP_ENABLED:-true}
      PROVIDER_AUDIT_RETENTION_DAYS: ${PROVIDER_AUDIT_RETENTION_DAYS:-90}
      PROVIDER_AUDIT_CLEANUP_HOUR_KST: ${PROVIDER_AUDIT_CLEANUP_HOUR_KST:-4}
      DATA_LIFECYCLE_CLEANUP_ENABLED: ${DATA_LIFECYCLE_CLEANUP_ENABLED:-false}
      DATA_LIFECYCLE_CLEANUP_HOUR_KST: ${DATA_LIFECYCLE_CLEANUP_HOUR_KST:-4}
      DATA_QUALITY_RETENTION_DAYS: ${DATA_QUALITY_RETENTION_DAYS:-180}
      NEWS_RETENTION_DAYS: ${NEWS_RETENTION_DAYS:-730}
      DISCLOSURE_RETENTION_DAYS: ${DISCLOSURE_RETENTION_DAYS:-3650}
      REFERENCE_ALERTS_ENABLED: ${REFERENCE_ALERTS_ENABLED:-false}
      REFERENCE_ALERT_INTERVAL_SECONDS: ${REFERENCE_ALERT_INTERVAL_SECONDS:-30}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ANALYSIS_API_KEY: ${ANALYSIS_API_KEY:-}
      ADMIN_MAX_FAILED_ATTEMPTS: ${ADMIN_MAX_FAILED_ATTEMPTS:-5}
      ADMIN_LOCKOUT_SECONDS: ${ADMIN_LOCKOUT_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-240}
      EXPENSIVE_RATE_LIMIT_REQUESTS: ${EXPENSIVE_RATE_LIMIT_REQUESTS:-30}
      TRUST_PROXY_HEADERS: "true"
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      HEALTH_CHECK_TIMEOUT_SECONDS: ${HEALTH_CHECK_TIMEOUT_SECONDS:-2}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_RELEASE: ${APP_RELEASE:-stockpilot-ai@0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      STOCK_PROVIDER: ${STOCK_PROVIDER:-mock}
      TOSS_BASE_URL: ${TOSS_BASE_URL:-https://openapi.tossinvest.com}
      TOSS_CLIENT_ID: ${TOSS_CLIENT_ID:-}
      TOSS_CLIENT_SECRET: ${TOSS_CLIENT_SECRET:-}
      TOSS_TIMEOUT_SECONDS: ${TOSS_TIMEOUT_SECONDS:-10}
      TOSS_MAX_RETRIES: ${TOSS_MAX_RETRIES:-3}
      FINANCIAL_PROVIDER: ${FINANCIAL_PROVIDER:-mock}
      DART_BASE_URL: ${DART_BASE_URL:-https://opendart.fss.or.kr/api}
      DART_API_KEY: ${DART_API_KEY:-}
      DART_TIMEOUT_SECONDS: ${DART_TIMEOUT_SECONDS:-15}
      DISCLOSURE_PROVIDER: ${DISCLOSURE_PROVIDER:-mock}
      NEWS_PROVIDER: ${NEWS_PROVIDER:-mock}
      NEWS_RSS_SEARCH_URL: ${NEWS_RSS_SEARCH_URL:-https://news.google.com/rss/search?q={query}&hl=ko&gl=KR&ceid=KR:ko}
      NEWS_TIMEOUT_SECONDS: ${NEWS_TIMEOUT_SECONDS:-10}
      NEWS_API_BASE_URL: ${NEWS_API_BASE_URL:-https://newsapi.org/v2}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_API_DAILY_REQUEST_LIMIT: ${NEWS_API_DAILY_REQUEST_LIMIT:-90}
      NEWS_TRAINING_SOURCE: ${NEWS_TRAINING_SOURCE:-gdelt}
      GDELT_DOC_API_URL: ${GDELT_DOC_API_URL:-https://api.gdeltproject.org/api/v2/doc/doc}
      GDELT_DAILY_REQUEST_LIMIT: ${GDELT_DAILY_REQUEST_LIMIT:-80}
      OFFICIAL_RSS_ENABLED: ${OFFICIAL_RSS_ENABLED:-true}
      OFFICIAL_RSS_DAILY_REQUEST_LIMIT: ${OFFICIAL_RSS_DAILY_REQUEST_LIMIT:-12}
      INVESTOR_FLOW_PROVIDER: ${INVESTOR_FLOW_PROVIDER:-mock}
      LOCAL_AI_ENABLED: ${LOCAL_AI_ENABLED:-false}
      LOCAL_AI_ARTIFACT_DIR: /app/artifacts/local-ai
      SEC_BASE_URL: ${SEC_BASE_URL:-https://data.sec.gov}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      FRED_BASE_URL: ${FRED_BASE_URL:-https://api.stlouisfed.org/fred}
      FRED_API_KEY: ${FRED_API_KEY:-}
      FINRA_API_BASE_URL: ${FINRA_API_BASE_URL:-https://api.finra.org}
      FINRA_TOKEN_URL: ${FINRA_TOKEN_URL:-https://ews.fip.finra.org/fip/rest/ews/oauth2/access_token}
      FINRA_CLIENT_ID: ${FINRA_CLIENT_ID:-}
      FINRA_CLIENT_SECRET: ${FINRA_CLIENT_SECRET:-}
      PREDICTION_ENGINE: ${PREDICTION_ENGINE:-lightweight}
      MODEL_ARTIFACT_ACTIVATION_ENABLED: ${MODEL_ARTIFACT_ACTIVATION_ENABLED:-false}
      MODEL_ARTIFACT_DIR: ${MODEL_ARTIFACT_DIR:-/app/artifacts/models}
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapi.koreainvestment.com:9443}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_TIMEOUT_SECONDS: ${KIS_TIMEOUT_SECONDS:-15}
      AI_REPORT_PROVIDER: mock
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      ACCOUNT_SYNC_ENABLED: ${ACCOUNT_SYNC_ENABLED:-false}
      TOSS_TRADING_ENABLED: ${TOSS_TRADING_ENABLED:-false}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-false}
      REALTIME_SOURCE: ${REALTIME_SOURCE:-polling}
      TOSS_WS_URL: ${TOSS_WS_URL:-wss://openapi-ws.tossinvest.com/ws/v1}
      TOSS_WS_RECONNECT_MAX_SECONDS: ${TOSS_WS_RECONNECT_MAX_SECONDS:-30}
      REALTIME_POLL_INTERVAL_SECONDS: ${REALTIME_POLL_INTERVAL_SECONDS:-2}
      REALTIME_CACHE_TTL_SECONDS: ${REALTIME_CACHE_TTL_SECONDS:-3}
      REALTIME_MAX_SYMBOLS: ${REALTIME_MAX_SYMBOLS:-20}
      REALTIME_MAX_CONNECTIONS: ${REALTIME_MAX_CONNECTIONS:-200}
      KIS_WS_URL: ${KIS_WS_URL:-ws://ops.koreainvestment.com:21000/tryitout}
      KIS_WS_RECONNECT_MAX_SECONDS: ${KIS_WS_RECONNECT_MAX_SECONDS:-30}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - model-artifacts:/app/artifacts/models
      - ./artifacts/local-ai:/app/artifacts/local-ai:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: ["sh", "-c", "if [ \"$$PERSISTENCE_ENABLED\" = \"true\" ]; then alembic upgrade head; fi && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000"]
  web:
    <<: *security-defaults
    init: true
    cap_drop: ["ALL"]
    pids_limit: 192
    mem_limit: 768m
    cpus: 0.75
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      api: { condition: service_healthy }
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ANALYSIS_API_KEY: ${ANALYSIS_API_KEY:-}
      ADMIN_UI_USERNAME: ${ADMIN_UI_USERNAME:-}
      ADMIN_UI_PASSWORD: ${ADMIN_UI_PASSWORD:-}
      ADMIN_PROXY_TIMEOUT_MS: ${ADMIN_PROXY_TIMEOUT_MS:-15000}
      ADMIN_PROXY_MAX_RESPONSE_BYTES: ${ADMIN_PROXY_MAX_RESPONSE_BYTES:-2000000}
      MARKET_PROXY_TIMEOUT_MS: ${MARKET_PROXY_TIMEOUT_MS:-20000}
      MARKET_PROXY_MAX_RESPONSE_BYTES: ${MARKET_PROXY_MAX_RESPONSE_BYTES:-3000000}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  trainer:
    <<: *security-defaults
    profiles: ["training"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_ML: "true"
    gpus: all
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    pids_limit: 512
    mem_limit: 4g
    cpus: 4.0
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./backend/app:/app/backend/app:ro
      - ./datasets:/app/datasets:ro
      - ./artifacts:/app/artifacts
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
    command: ["python", "scripts/ai/training/check_gpu_training.py"]
  collector:
    <<: *security-defaults
    profiles: ["collection"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_ML: "false"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      LOCAL_AI_COLLECTION_SYMBOLS: ${LOCAL_AI_COLLECTION_SYMBOLS:-}
      LOCAL_AI_KIS_SYMBOLS: ${LOCAL_AI_KIS_SYMBOLS:-}
      LOCAL_AI_COLLECTION_OUTPUT_DIR: ${LOCAL_AI_COLLECTION_OUTPUT_DIR:-/app/datasets/local-ai-incremental}
      NEWS_TRAINING_SOURCE: ${NEWS_TRAINING_SOURCE:-gdelt}
      NEWS_API_BASE_URL: ${NEWS_API_BASE_URL:-https://newsapi.org/v2}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_API_DAILY_REQUEST_LIMIT: ${NEWS_API_DAILY_REQUEST_LIMIT:-90}
      GDELT_DOC_API_URL: ${GDELT_DOC_API_URL:-https://api.gdeltproject.org/api/v2/doc/doc}
      GDELT_DAILY_REQUEST_LIMIT: ${GDELT_DAILY_REQUEST_LIMIT:-80}
      OFFICIAL_RSS_ENABLED: ${OFFICIAL_RSS_ENABLED:-true}
      OFFICIAL_RSS_DAILY_REQUEST_LIMIT: ${OFFICIAL_RSS_DAILY_REQUEST_LIMIT:-12}
      ALPHA_VANTAGE_BASE_URL: ${ALPHA_VANTAGE_BASE_URL:-https://www.alphavantage.co/query}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      ALPHA_VANTAGE_DAILY_REQUEST_LIMIT: ${ALPHA_VANTAGE_DAILY_REQUEST_LIMIT:-25}
      FRED_BASE_URL: ${FRED_BASE_URL:-https://api.stlouisfed.org/fred}
      FRED_API_KEY: ${FRED_API_KEY:-}
      SEC_BASE_URL: ${SEC_BASE_URL:-https://data.sec.gov}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      STOCK_PROVIDER: ${STOCK_PROVIDER:-mock}
      TOSS_BASE_URL: ${TOSS_BASE_URL:-https://openapi.tossinvest.com}
      TOSS_CLIENT_ID: ${TOSS_CLIENT_ID:-}
      TOSS_CLIENT_SECRET: ${TOSS_CLIENT_SECRET:-}
      TOSS_TIMEOUT_SECONDS: ${TOSS_TIMEOUT_SECONDS:-10}
      TOSS_MAX_RETRIES: ${TOSS_MAX_RETRIES:-3}
      FINRA_API_BASE_URL: ${FINRA_API_BASE_URL:-https://api.finra.org}
      FINRA_TOKEN_URL: ${FINRA_TOKEN_URL:-https://ews.fip.finra.org/fip/rest/ews/oauth2/access_token}
      FINRA_CLIENT_ID: ${FINRA_CLIENT_ID:-}
      FINRA_CLIENT_SECRET: ${FINRA_CLIENT_SECRET:-}
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapi.koreainvestment.com:9443}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_TIMEOUT_SECONDS: ${KIS_TIMEOUT_SECONDS:-15}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./backend/app:/app/backend/app:ro
      - ./datasets:/app/datasets
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    entrypoint: ["python", "scripts/ai/data/collect_local_ai_incremental.py"]
  nginx:
    <<: *security-defaults
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.25
    image: nginx:1.27-alpine
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["127.0.0.1:8080:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    <<: *security-defaults
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockpilot}
      POSTGRES_USER: ${POSTGRES_USER:-stockpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["127.0.0.1:5432:5432"]
  redis:
    <<: *security-defaults
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.25
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["127.0.0.1:6379:6379"]
  prometheus:
    <<: *security-defaults
    pids_limit: 192
    mem_limit: 768m
    cpus: 0.5
    image: prom/prometheus:v3.13.1
    profiles: ["monitoring"]
    depends_on:
      api: { condition: service_healthy }
      alertmanager: { condition: service_started }
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
  alertmanager:
    <<: *security-defaults
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.25
    image: prom/alertmanager:v0.32.1
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ${ALERTMANAGER_CONFIG_PATH:-./infrastructure/monitoring/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERTMANAGER_SECRETS_PATH:-./infrastructure/monitoring/secrets-empty}:/run/secrets:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
  grafana:
    <<: *security-defaults
    pids_limit: 192
    mem_limit: 512m
    cpus: 0.5
    image: grafana/grafana:13.0.2
    profiles: ["monitoring"]
    depends_on:
      prometheus: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  model-artifacts:
